services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cocotte
      POSTGRES_USER: postgres
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - .env.prod
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # nginx : sert la SPA et reverse-proxie /api et /admin vers "backend" en HTTP interne
  # uniquement. Pas de "ports:" ni de TLS ici : le Caddy partagé de l'hôte (cf. guide de
  # déploiement, /opt/docker/caddy) fait office de reverse proxy d'entrée et termine le HTTPS
  # pour tous les sous-domaines du serveur, en atteignant ce conteneur via le réseau externe
  # "proxy".
  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: cocotte-frontend
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - backend
    networks:
      - default
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  postgres_data:
  static_data:
  media_data:
