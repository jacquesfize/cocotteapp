# Stack de production — mode standalone par défaut (voir le README, section "Déploiement en
# production"). Utilisable tel quel :
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# "frontend" sert la SPA, reverse-proxie /api et /django-admin vers "backend", et termine lui-même le
# TLS via un Caddy interne qui obtient/renouvelle seul un certificat Let's Encrypt pour DOMAIN
# (voir deploy/Caddyfile.standalone). C'est le mode à utiliser quand l'app est seule sur le
# serveur.
#
# Pour s'appuyer à la place sur un Caddy déjà présent sur l'hôte, partagé par plusieurs apps,
# combiner ce fichier avec l'overlay docker-compose.prod.proxy.yml :
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.proxy.yml --env-file .env.prod up --build -d
#
# Relais SMTP Postfix optionnel (envoi seul, pour les emails de réinitialisation de mot de passe),
# activé par le profil "mail" — combinable avec les deux modes ci-dessus :
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile mail up --build -d
#
# Voir MAIL_* dans .env.prod.example et la section "Email (SMTP)" de la doc de configuration
# (enregistrements DNS SPF/DKIM/DMARC, reverse DNS, port 25 sortant).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cocotte
      POSTGRES_USER: postgres
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - .env.prod
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: cocotte-frontend
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile.standalone:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
    restart: unless-stopped

  mail:
    image: boky/postfix:latest
    profiles: ["mail"]
    environment:
      # Seuls les expéditeurs de ce domaine sont acceptés (celui de DEFAULT_FROM_EMAIL).
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      # Nom annoncé en HELO : doit correspondre au reverse DNS (PTR) de l'IP du serveur.
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-mail.${MAIL_DOMAIN:-localhost}}
      # Clé DKIM générée au premier démarrage, conservée dans le volume postfix_dkim.
      DKIM_AUTOGENERATE: "true"
      # Optionnel : relayer via un fournisseur SMTP plutôt que livrer en direct (port 25 sortant
      # bloqué, IP à mauvaise réputation...), ex. "[smtp-relay.brevo.com]:587".
      RELAYHOST: ${MAIL_RELAYHOST:-}
      RELAYHOST_USERNAME: ${MAIL_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${MAIL_RELAYHOST_PASSWORD:-}
    # Aucun port publié : seul "backend" l'atteint, via le réseau interne du stack. Le relais
    # n'accepte sans authentification que les réseaux privés, ce n'est donc pas un relais ouvert.
    volumes:
      - postfix_dkim:/etc/opendkim/keys
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
  postfix_dkim:
