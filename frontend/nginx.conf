# HTTP interne uniquement : ce nginx ne gère ni domaine ni certificat. Le Caddy partagé de
# l'hôte (voir /opt/docker/caddy/Caddyfile) reverse-proxie vers "cocotte-frontend:80" et
# termine le HTTPS pour tous les sous-domaines du serveur.
server {
	listen 80;
	server_tokens off;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

	location /static/ {
		alias /srv/static/;
	}

	location /media/ {
		alias /srv/media/;
	}

	location ~ ^/(api|admin)/ {
		proxy_pass http://backend:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Ce nginx n'est atteint que depuis le Caddy hôte (jamais exposé directement), qui a déjà
		# terminé le TLS : on peut donc affirmer https ici sans se soucier du saut interne en
		# clair. Sans ça, SECURE_SSL_REDIRECT côté Django renverrait un 301 sur chaque requête,
		# y compris les vraies requêtes HTTPS des utilisateurs.
		proxy_set_header X-Forwarded-Proto https;
	}

	# SPA (Vue Router en mode history) : toute route inconnue retombe sur index.html.
	location / {
		root /srv/app;
		try_files $uri $uri/ /index.html;
	}
}
